name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Check shell entrypoint syntax
        run: bash -n install.sh
      - name: Compile installer
        run: python3 -m py_compile scripts/install.py plugins/kinescope-download/skills/kinescope-video-download/scripts/extract_manifest.py plugins/kinescope-download/skills/kinescope-video-download/scripts/local_history.py
      - name: Run package and installer tests
        run: python3 -m unittest discover -s tests -v
